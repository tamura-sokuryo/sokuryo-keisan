<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>測量計算ミニ</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#202124}
header{background:#17324d;color:white;padding:18px 16px;font-weight:700;font-size:20px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:white;position:sticky;top:0;z-index:2}
nav button{border:0;background:#e9edf1;border-radius:9px;padding:11px 3px;font-weight:700;font-size:13px}
nav button.on{background:#17324d;color:#fff}
footer{text-align:center;color:#66717d;font-size:12px;padding:24px 12px 28px}
main{padding:12px;max-width:600px;margin:auto}.panel{display:none}.panel.on{display:block}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#66717d;font-weight:700} input{width:100%;padding:12px 9px;border:1px solid #ccd3da;border-radius:8px;font-size:17px;margin-top:4px}
button.calc{width:100%;padding:13px;border:0;border-radius:9px;background:#17324d;color:white;font-weight:700;font-size:16px;margin-top:12px}
.result{margin-top:12px;background:#eef4f8;border-radius:9px;padding:13px;font-size:15px}.big{font-size:25px;font-weight:800}
.row{display:flex;gap:7px;align-items:end}.row>*{flex:1}.smallbtn{flex:0 0 82px!important;padding:11px;border:0;border-radius:8px;background:#e1e6eb;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #e5e8eb;text-align:right}th:first-child,td:first-child{text-align:center}
.num3{color:#c40000;font-weight:800;white-space:nowrap}.num5{color:#222;font-size:.74em;font-weight:500;white-space:nowrap;margin-left:4px}.num5::before{content:"（"}.num5::after{content:"）"}.big .num3{font-size:1em}.big .num5{font-size:.56em;vertical-align:middle}
.hint{font-size:12px;color:#6b7280;line-height:1.5}.axis-legend{position:absolute;right:8px;bottom:7px;display:flex;justify-content:flex-end;align-items:center;width:60px;height:24px;margin:0;z-index:3;pointer-events:none;background:#fff}.axis-legend svg{width:60px;height:24px;display:block}.axis-legend text{font-size:9px;fill:#555}.sketch{position:relative;margin-top:10px;background:#fff;border:1px solid #dde3e8;border-radius:9px;padding:6px}.sketch svg{width:100%;height:auto}.trav-figure-wrap{position:relative}.trav-figure-wrap>.axis-legend{position:absolute;right:10px;bottom:10px}.danger{background:#fff0f0!important;color:#a22!important}
</style>
</head>
<body>
<header>測量計算ミニ</header>
<nav>
<button class="on" onclick="tab('dist',this)">2点間</button>
<button onclick="tab('perp',this)">垂線</button>
<button onclick="tab('trav',this)">トラバース放射</button>
<button onclick="tab('coord',this)">トラバース連続</button>
</nav>
<main>
<section id="dist" class="panel on">
<div class="card"><h2>2点間距離・方向角</h2>
<div class="grid">
<label>P1 X<input id="dx1" type="number" step="any"></label><label>P1 Y<input id="dy1" type="number" step="any"></label>
<label>P2 X<input id="dx2" type="number" step="any"></label><label>P2 Y<input id="dy2" type="number" step="any"></label>
</div><button class="calc" onclick="distance()">計算</button><button class="calc" onclick="distance()">再計算</button><div id="dres"></div></div></section>

<section id="perp" class="panel">
<div class="card"><h2>P点からABへの垂線</h2>
<div class="grid">
<label>A X<input id="ax" type="number" step="any"></label><label>A Y<input id="ay" type="number" step="any"></label>
<label>B X<input id="bx" type="number" step="any"></label><label>B Y<input id="by" type="number" step="any"></label>
</div>
<button class="calc" onclick="startPerp()">基準線を設定</button>
</div>
<div class="card" id="pentry" style="display:none">
<h2>垂線点を計算</h2>
<div id="pperpforms"></div>
</div>
</section>

<section id="trav" class="panel">
<div class="card"><h2>トラバース放射</h2>
<p class="hint">P1を器械点、P2を後視点として固定します。P1からP2を後視し、P1を中心に後視方向からの「夾角」と「距離」からP3、P4、P5…を放射状に求めます。追加する点でも<strong>器械点P1・後視点P2は変わりません</strong>。閉合計算・補正は行いません。</p>
<div class="grid">
<label>P1（器械点）X<input id="tx1" type="number" step="any"></label><label>P1（器械点）Y<input id="ty1" type="number" step="any"></label>
<label>P2（後視）X<input id="tx2" type="number" step="any"></label><label>P2（後視）Y<input id="ty2" type="number" step="any"></label>
</div>
<button class="calc" onclick="startTrav()">器械点・後視を設定</button>
</div>
<div class="card" id="tentry" style="display:none">
<div id="travForms"></div>
</div>
<div class="card" id="tlist" style="display:none">
<div id="travSummary"></div>
<button class="calc danger" onclick="resetTrav()">クリア</button>
</div>
</section>

<section id="coord" class="panel">
<div class="card"><h2>トラバース連続</h2>
<p class="hint">P1を最初の器械点、P2を最初の後視点として設定します。P3以降は、1つ前の点へ器械点を移し、その1つ前の器械点を後視して順次計算します。図はP2→P1→P3→P4→P5…の順に結びます。閉合計算・補正は行いません。</p>
<div class="grid">
<label>P1（器械点）X<input id="cx1" type="number" step="any"></label><label>P1（器械点）Y<input id="cy1" type="number" step="any"></label>
<label>P2（後視）X<input id="cx2" type="number" step="any"></label><label>P2（後視）Y<input id="cy2" type="number" step="any"></label>
</div>
<button class="calc" onclick="startContinuous()">器械点・後視を設定</button>
</div>
<div class="card" id="centry" style="display:none">
<div id="continuousForms"></div>
</div>
<div class="card" id="clist" style="display:none">
<div id="continuousSummary"></div>
<button class="calc danger" onclick="resetContinuous()">クリア</button>
</div>
</section>
</main>
<footer>田村測量事務所</footer>
<script>
const $=id=>document.getElementById(id);
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function n(id){return parseFloat($(id).value)}
function fmt(x){return Number(x).toFixed(5)}
function round3(x){if(!Number.isFinite(x))return NaN;const s=x<0?-1:1;return s*(Math.round((Math.abs(x)+1e-10)*1000)/1000)}
function trunc3(x){if(!Number.isFinite(x))return NaN;const s=x<0?-1:1;return s*(Math.floor((Math.abs(x)+1e-10)*1000)/1000)}
function coord3(x){let v=round3(x);if(Object.is(v,-0))v=0;return Number(v).toFixed(3)}
function dim3(x){let v=trunc3(x);if(Object.is(v,-0))v=0;return Number(v).toFixed(3)}
function coordHtml(x){return `<span class="num3">${coord3(x)}</span><span class="num5">${fmt(x)}</span>`}
function dimHtml(x){return `<span class="num3">${dim3(x)}</span><span class="num5">${fmt(x)}</span>`}
function svgDim(x){return `<tspan fill="#c40000" font-size="12" font-weight="700">${dim3(x)} m</tspan><tspan fill="#222" font-size="8" dx="3">(${fmt(x)})</tspan>`}
function angle(s){if(typeof s==='number')s=String(s);s=String(s).trim();if(!s)return NaN; if(/[°′'″"]/.test(s)){let m=s.match(/([\d.]+)\s*°?\s*(?:([\d.]+)\s*[′']?)?\s*(?:([\d.]+)\s*[″"]?)?/);if(m){let D=+m[1],M=+(m[2]||0),S=+(m[3]||0);if(M>=60||S>=60)return NaN;return D+M/60+S/3600}} let v=parseFloat(s);if(!Number.isFinite(v))return NaN; if(s.includes('.')){let parts=s.split('.');let D=+parts[0];let packed=(parts[1]||'').padEnd(4,'0').slice(0,4);let M=+(packed.slice(0,2)||0),S=+(packed.slice(2,4)||0);if(M>=60||S>=60)return NaN;return D+M/60+S/3600} return v}
function degstr(d){d=((d%360)+360)%360;let D=Math.floor(d),m=(d-D)*60,M=Math.floor(m),S=(m-M)*60;return `${D}°${String(M).padStart(2,'0')}′${S.toFixed(2).padStart(5,'0')}″`}
function distance(){
  const x1=n('dx1'), y1=n('dy1'), x2=n('dx2'), y2=n('dy2');
  const dx=x2-x1, dy=y2-y1, r=Math.hypot(dx,dy);
  let a=Math.atan2(dy,dx)*180/Math.PI; a=(a+360)%360;

  const W=420,H=280,pad=54;
  const xs=[x1,x2], ys=[y1,y2];
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const spanX=maxX-minX || 1, spanY=maxY-minY || 1;
  const scale=Math.min((W-2*pad)/spanY,(H-2*pad)/spanX);
  const sx=y=>pad+(y-minY)*scale;
  const sy=x=>H-pad-(x-minX)*scale;
  const P1={x:sx(y1),y:sy(x1)}, P2={x:sx(y2),y:sy(x2)};

  // 測量座標系：縦＝X（X＋は上）、横＝Y（Y＋は右）。
  // 実座標の方向関係をそのまま図へ反映する。
  const dxs=P2.x-P1.x, dys=P2.y-P1.y, L=Math.hypot(dxs,dys)||1;
  const nx=-dys/L*16, ny=dxs/L*16;
  const mx=(P1.x+P2.x)/2, my=(P1.y+P2.y)/2;
  const tx=Math.max(12,Math.min(W-90,mx+nx+4));
  const ty=Math.max(22,Math.min(H-18,my+ny-2));

  $('dres').innerHTML=`<div class=result>ΔX ${coordHtml(dx)}　ΔY ${coordHtml(dy)}<br><span class=big>${dimHtml(r)} m</span><br>方向角　${degstr(a)}</div>
  <div class="sketch"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${P1.x}" y1="${P1.y}" x2="${P2.x}" y2="${P2.y}" stroke="#17324d" stroke-width="3"/>
    <line x1="${P1.x+nx}" y1="${P1.y+ny}" x2="${P2.x+nx}" y2="${P2.y+ny}" stroke="#999" stroke-width="1"/>
    <text x="${tx}" y="${ty}">${svgDim(r)}</text>
    <circle cx="${P1.x}" cy="${P1.y}" r="6" fill="#17324d"/><circle cx="${P2.x}" cy="${P2.y}" r="6" fill="#17324d"/>
    <text x="${P1.x+8}" y="${P1.y-8}" font-size="14" font-weight="700" fill="#17324d">P1</text>
    <text x="${P2.x+8}" y="${P2.y-8}" font-size="14" font-weight="700" fill="#17324d">P2</text>
  </svg><div class="axis-legend"><svg viewBox="0 0 60 24" aria-label="X軸とY軸の正方向"><defs><marker id="legendArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><line x1="14" y1="20" x2="14" y2="5" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><line x1="14" y1="20" x2="31" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><text x="3" y="6" font-size="9">X＋</text><text x="34" y="23" font-size="9">Y＋</text></svg></div></div>`
}
let perpBase=null, perpCount=0;

function startPerp(){
  let ax=n('ax'),ay=n('ay'),bx=n('bx'),by=n('by');
  if(![ax,ay,bx,by].every(Number.isFinite)){ $('pentry').style.display='none'; return; }
  if(Math.hypot(bx-ax,by-ay)===0){ $('pentry').style.display='none'; return; }
  perpBase={ax,ay,bx,by};
  perpCount=0;
  $('pperpforms').innerHTML='';
  $('pentry').style.display='block';
  addPerpPoint();
}

function addPerpPoint(){
  perpCount++;
  const id=perpCount;
  const div=document.createElement('div');
  div.className='card';
  div.style.marginTop='12px';
  div.innerHTML=`
    <h3>P${id} 垂線計算</h3>
    <div class="grid">
      <label>P${id} X<input id="ppx${id}" type="number" step="any"></label>
      <label>P${id} Y<input id="ppy${id}" type="number" step="any"></label>
    </div>
    <button class="calc" onclick="calcPerpPoint(${id})">計算</button>
    <button class="calc" id="pr${id}" onclick="calcPerpPoint(${id})" style="display:none">再計算</button>
    <div id="ppr${id}"></div>
    <div id="ppg${id}"></div>
    <button class="calc" id="pa${id}" onclick="addPerpPoint()" style="display:none">次の点を追加</button>`;
  $('pperpforms').appendChild(div);
}

function calcPerpPoint(id){
  if(!perpBase)return;
  let ax=perpBase.ax,ay=perpBase.ay,bx=perpBase.bx,by=perpBase.by,
      px=n('ppx'+id),py=n('ppy'+id);
  if(!Number.isFinite(px)||!Number.isFinite(py)){
    $('ppr'+id).innerHTML='<div class="result">Pの座標を入力してください。</div>';
    return;
  }
  let vx=bx-ax,vy=by-ay,L=Math.hypot(vx,vy),L2=L*L;
  let t=((px-ax)*vx+(py-ay)*vy)/L2,
      hx=ax+t*vx,hy=ay+t*vy;
  let d=Math.hypot(px-hx,py-hy),
      ah=Math.hypot(hx-ax,hy-ay),
      bh=Math.hypot(hx-bx,hy-by);

  // 測量座標の図では、横軸がY（＋右）、縦軸がX（＋上）。
  // A→Bを向いて左側なら「左」、右側なら「右」とする。
  const sideCross=(by-ay)*(px-ax)-(bx-ax)*(py-ay);
  let sideText=Math.abs(sideCross)<1e-12?'基準線上':(sideCross>0?'左':'右');

  // ─────────────────────────────────────────────
  // 垂線図：V36までの「H周辺を拡大」の考え方を維持。
  // 縦＝X＋、横＝Y＋。P/Hの実方向はそのまま、AB部分は
  // 必要に応じて線上の縮尺を変えて、A・B・Hの位置関係を優先して表示する。
  // ─────────────────────────────────────────────
  const W=620,H=600;
  const OX=310, OY=390;

  // V36系の拡大ルール：PHをまず見やすくし、短い距離ほど拡大する。
  let phPx = d<=0.01 ? Math.max(20, Math.min(40, d*4000))
           : d<=0.15 ? 360
           : d<=0.30 ? 240
           : d<=1.00 ? 180
           : 120;
  let scale=phPx/Math.max(d,1e-9);

  // 測量座標 → SVG：Yが左右、Xが上下（X＋は上）。
  const Hpt={x:OX,y:OY};
  const Ppt={x:OX+(py-hy)*scale, y:OY-(px-hx)*scale};

  // A→B方向の画面上単位ベクトル。
  const ux=(by-ay)/L;
  const uy=-(bx-ax)/L;
  // HからA/Bへ向かう線上距離（A→Bを正方向とする）。
  const sA=-t*L;
  const sB=(1-t)*L;
  const pointAt=(s)=>({x:OX+ux*s,y:OY+uy*s});

  // ABは「実距離の縮尺」より「位置関係の判読性」を優先して表示する。
  // H→A→B の並びになる場合は H-A を点線、A-B を実線、Bの先を点線。
  // H→B→A の場合も同様。AB区間内にHがある場合はA-Bを実線、外側を点線。
  let aPos,bPos;
  let note='';
  const SIDE=200;
  const MIN=60;
  if(t<0){
    aPos=75;
    bPos=205;
    note='AB部分は位置関係を優先して表示';
  }else if(t>1){
    bPos=-75;
    aPos=-205;
    note='AB部分は位置関係を優先して表示';
  }else{
    // HがAB間にあるときは、Hからの左右距離をおおむね比率で残す。
    let da=t*SIDE;
    let db=(1-t)*SIDE;
    if(t>0 && da<MIN) da=MIN;
    if(t<1 && db<MIN) db=MIN;
    aPos=-da;
    bPos=db;
  }

  // 線分の両端と外側の延長を、必ず同じ図の中に収める。
  const ext=55;
  const solidA=Math.min(aPos,bPos), solidB=Math.max(aPos,bPos);
  const rangeMin=solidA-ext, rangeMax=solidB+ext;
  const clampS=(s)=>Math.max(rangeMin,Math.min(rangeMax,s));
  const pA=pointAt(aPos), pB=pointAt(bPos);

  const solid='stroke="#17324d" stroke-width="4" stroke-linecap="round"';
  const dash='stroke="#17324d" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"';
  let svgParts=[];

  // 外側の延長は点線、AB間は実線。
  if(t<0){
    const p0=pointAt(0), p1=pointAt(aPos), p2=pointAt(bPos), p3=pointAt(clampS(bPos+ext));
    svgParts.push(`<line x1="${p0.x}" y1="${p0.y}" x2="${p1.x}" y2="${p1.y}" ${dash}/>`);
    svgParts.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" ${solid}/>`);
    svgParts.push(`<line x1="${p2.x}" y1="${p2.y}" x2="${p3.x}" y2="${p3.y}" ${dash}/>`);
  }else if(t>1){
    const p0=pointAt(0), p1=pointAt(bPos), p2=pointAt(aPos), p3=pointAt(clampS(aPos-ext));
    svgParts.push(`<line x1="${p3.x}" y1="${p3.y}" x2="${p2.x}" y2="${p2.y}" ${dash}/>`);
    svgParts.push(`<line x1="${p2.x}" y1="${p2.y}" x2="${p1.x}" y2="${p1.y}" ${solid}/>`);
    svgParts.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p0.x}" y2="${p0.y}" ${dash}/>`);
  }else{
    const p0=pointAt(clampS(aPos-ext)), p1=pointAt(aPos), p2=pointAt(bPos), p3=pointAt(clampS(bPos+ext));
    svgParts.push(`<line x1="${p0.x}" y1="${p0.y}" x2="${p1.x}" y2="${p1.y}" ${dash}/>`);
    svgParts.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" ${solid}/>`);
    svgParts.push(`<line x1="${p2.x}" y1="${p2.y}" x2="${p3.x}" y2="${p3.y}" ${dash}/>`);
  }

  // A/BラベルはAB線の両端に置き、Pのある側と反対側へ逃がす。
  // これでHがA側/B側の延長にあっても、A・Bが重ならない。
  const qLen=Math.hypot(ux,uy)||1;
  const nx=-uy/qLen, ny=ux/qLen;
  const screenCross=(by-ay)*(-(px-ax)) - (-(bx-ax))*(py-ay);
  // screenCross>0 は図上の左側、<0 は右側。Pとは反対側へラベルを置く。
  const labelSide=screenCross>=0 ? -1 : 1;
  function addLabel(pt,text){
    const gap=18;
    let tx=pt.x+nx*gap*labelSide;
    let ty=pt.y+ny*gap*labelSide;
    tx=Math.max(22,Math.min(W-22,tx));
    ty=Math.max(88,Math.min(H-18,ty));
    const width=text.length*11+16;
    const rectX=Math.max(3,Math.min(W-width-3,tx-width/2));
    const rectY=Math.max(64,Math.min(H-30,ty-20));
    return `<g><rect x="${rectX}" y="${rectY}" width="${width}" height="25" rx="4" fill="#fff" fill-opacity="0.95" stroke="#fff" stroke-width="1"/><text x="${tx}" y="${ty}" font-size="17" font-weight="700" text-anchor="middle" fill="#17324d">${text}</text></g>`;
  }
  svgParts.push(addLabel(pA,'A'));
  svgParts.push(addLabel(pB,'B'));

  // PH：PとHの実際の座標方向をそのまま描く。
  if(d>1e-12){
    svgParts.push(`<line x1="${Ppt.x}" y1="${Ppt.y}" x2="${Hpt.x}" y2="${Hpt.y}" stroke="#d22" stroke-width="6" stroke-linecap="round"/>`);
  }

  // 直角記号：AB方向とPH方向の実際の向きから生成。
  let pux=0,puy=-1;
  if(d>1e-12){
    const plen=Math.hypot(Ppt.x-Hpt.x,Ppt.y-Hpt.y)||1;
    pux=(Ppt.x-Hpt.x)/plen; puy=(Ppt.y-Hpt.y)/plen;
  }
  const mark=Math.min(28,Math.max(12,d*scale*.45));
  const q0={x:OX+ux*mark,y:OY+uy*mark};
  const q1={x:q0.x+pux*mark,y:q0.y+puy*mark};
  const q2={x:OX+pux*mark,y:OY+puy*mark};
  if(d>1e-12)svgParts.push(`<polyline points="${q0.x},${q0.y} ${q1.x},${q1.y} ${q2.x},${q2.y}" fill="none" stroke="#06c" stroke-width="3"/>`);

  svgParts.push(`<circle cx="${Hpt.x}" cy="${Hpt.y}" r="7" fill="#17324d"/>`);
  if(d>1e-12)svgParts.push(`<circle cx="${Ppt.x}" cy="${Ppt.y}" r="7" fill="#d22"/>`);

    ${t<0 ? `B→H：${dimHtml(L)}＋${dimHtml(ah)}＝${dimHtml(bh)} m（AB線分＋AH）` : t>1 ? `B→H：${dimHtml(bh)} m（Bの外側）` : `B→H：${dimHtml(bh)} m`}<br>
    垂線足 H　X ${coordHtml(hx)}　Y ${coordHtml(hy)}
  </div>`;

  $('ppg'+id).innerHTML=`<div class="sketch" style="overflow:hidden;margin-top:8px">
    <div style="font-weight:700;text-align:center;margin-bottom:2px">P${id} 垂線チェック（H周辺を拡大）</div>
    <div style="text-align:center;font-size:13px;color:#555;margin-bottom:4px">縦＝X軸（＋上）／横＝Y軸（＋右）　A－B間：実線 ／ 延長：点線${note?`　（${note}）`:''}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:#fff">
      ${svgParts.join('')}
    </svg>
    <div class="axis-legend"><svg viewBox="0 0 60 24" aria-label="X軸とY軸の正方向"><defs><marker id="legendArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><line x1="14" y1="20" x2="14" y2="5" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><line x1="14" y1="20" x2="31" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><text x="3" y="6" font-size="9">X＋</text><text x="34" y="23" font-size="9">Y＋</text></svg></div>

}

function calcRadialForm(card){
  const turn=angle(card.querySelector('.ra').value);
  const d=parseFloat(card.querySelector('.rd').value);
  if(!Number.isFinite(turn)||!Number.isFinite(d)){
    card.querySelector('.rres').innerHTML='<div class="result">角度と距離を入力してください。</div>'; return;
  }
  const inst=trav[0], backsight=trav[1];
  const base=(Math.atan2(backsight.y-inst.y,backsight.x-inst.x)*180/Math.PI+360)%360;
  const a=(base+turn)%360;
  const r=a*Math.PI/180;
  const x=inst.x+d*Math.cos(r), y=inst.y+d*Math.sin(r);
  const p=card.querySelector('h2').textContent.match(/P\d+/)[0];
  const obj={p,role:'放射点',x,y,dist:d,ang:degstr(turn),dir:a};
  const idx=trav.findIndex(v=>v.p===p);
  if(idx>=0) trav[idx]=obj; else trav.push(obj);
  card.querySelector('.rres').innerHTML=`<div class="result"><b>${p}</b><br><span class="big">X ${coordHtml(x)}</span><br><span class="big">Y ${coordHtml(y)}</span><br>方向角（P1→${p}）　${degstr(a)}</div>`;
  card.querySelector('.rcalc').style.display='none';
  card.querySelector('.rrecalc').style.display='inline-block';
  card.querySelector('.rnext').style.display='inline-block';
  drawSingleRadial(card,inst,backsight,obj);
  renderTravSummary();
}
function drawSingleRadial(card,p1,p2,p){
  const pts=[p1,p2,p], xs=pts.map(v=>v.x), ys=pts.map(v=>v.y);
  let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  let span=Math.max(maxx-minx,maxy-miny,1), W=360,H=270,pad=52;
  const scale=Math.min((W-pad*2)/span,(H-pad*2)/span);
  // 測量座標系：X+は上、Y+は右
  const sx=(v)=>pad+(v.y-miny)*scale;
  const sy=(v)=>H-pad-(v.x-minx)*scale;
  const A={x:sx(p1),y:sy(p1)},B={x:sx(p2),y:sy(p2)},Q={x:sx(p),y:sy(p)};
  const base=Math.atan2(B.x-A.x,-(B.y-A.y));
  const target=Math.atan2(Q.x-A.x,-(Q.y-A.y));
  let delta=target-base;
  while(delta<0)delta+=Math.PI*2;
  while(delta>=Math.PI*2)delta-=Math.PI*2;
  const R=30, seg=Math.max(12,Math.ceil(delta*R/2));
  const arc=[];
  for(let i=0;i<=seg;i++){
    const aa=base+delta*i/seg;
    arc.push(`${A.x+R*Math.sin(aa)},${A.y-R*Math.cos(aa)}`);
  }
  const dx=Q.x-A.x,dy=Q.y-A.y,L=Math.hypot(dx,dy)||1,nx=-dy/L*12,ny=dx/L*12;
  card.querySelector('.rfig').innerHTML=`<div class="hint"><b>${p.p}の放射図</b></div><div class="sketch"><svg viewBox="0 0 360 270">
  <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#777" stroke-width="1.5"/>
  <line x1="${A.x}" y1="${A.y}" x2="${Q.x}" y2="${Q.y}" stroke="#17324d" stroke-width="2.5"/>
  <polyline points="${arc.join(' ')}" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <line x1="${A.x+nx}" y1="${A.y+ny}" x2="${Q.x+nx}" y2="${Q.y+ny}" stroke="#999"/>
  <text x="${(A.x+Q.x)/2+4}" y="${(A.y+Q.y)/2-5}" font-size="11">${svgDim(p.dist)}</text>
  <circle cx="${A.x}" cy="${A.y}" r="4" fill="#17324d"/><text x="${A.x+6}" y="${A.y-6}">P1</text>
  <circle cx="${B.x}" cy="${B.y}" r="4" fill="#17324d"/><text x="${B.x+6}" y="${B.y-6}">P2</text>
  <circle cx="${Q.x}" cy="${Q.y}" r="4" fill="#17324d"/><text x="${Q.x+6}" y="${Q.y-6}">${p.p}</text>
  </svg><div class="axis-legend"><svg viewBox="0 0 60 24" aria-label="X軸とY軸の正方向"><defs><marker id="legendArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><line x1="14" y1="20" x2="14" y2="5" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><line x1="14" y1="20" x2="31" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><text x="3" y="6" font-size="9">X＋</text><text x="34" y="23" font-size="9">Y＋</text></svg></div></div>`;
}
function deleteRadialForm(card){
  const m=card.querySelector('h2').textContent.match(/P\d+/);
  if(m){
    const target=m[0];
    // 削除対象の点だけを削除。ほかの計算済み点（P3など）は絶対に触らない。
    const idx=trav.findIndex(v=>v.p===target);
    if(idx>=2) trav.splice(idx,1);
  }
  card.remove();
  renderTravSummary();
}

  <div class="grid"><label>夾角（右回り）<input class="ca2" placeholder="90.0556"></label><label>距離(m)<input class="cd2" type="number" step="any"></label></div>

  // 「最終点だけ削除できる」ように、追加されたら前の点の削除ボタンを隠す。

}

function calcContinuousForm(card, cascade=true){
  const turn=angle(card.querySelector('.ca2').value);
  const d=parseFloat(card.querySelector('.cd2').value);
  if(!Number.isFinite(turn)||!Number.isFinite(d)){
    card.querySelector('.cres2').innerHTML='<div class="result">角度と距離を入力してください。</div>';
    return false;
  }

  const pnum=parseInt(card.querySelector('h2').textContent.match(/P(\d+)/)[1],10);

  // 連続トラバース：
  // P3 = P1器械点・P2後視
  // P4 = P3器械点・P1後視
  // P5 = P4器械点・P3後視
  // P6 = P5器械点・P4後視 …
  let stationName, backsightName;
  if(pnum===3){
    stationName='P1';
    backsightName='P2';
  }else if(pnum===4){
    stationName='P3';
    backsightName='P1';
  }else{
    stationName='P'+(pnum-1);
    backsightName='P'+(pnum-2);
  }

  const st=continuous.find(v=>v.p===stationName);
  const bs=continuous.find(v=>v.p===backsightName);

  if(!st||!bs){
    card.querySelector('.cres2').innerHTML=
      '<div class="result">器械点・後視点の座標がありません。先に前の点を計算してください。</div>';
    return false;
  }

  // 後視方向 → 右回り（時計回り）の内角
  const base=(Math.atan2(bs.y-st.y,bs.x-st.x)*180/Math.PI+360)%360;
  const dir=(base+turn)%360;
  const r=dir*Math.PI/180;
  const x=st.x+d*Math.cos(r);
  const y=st.y+d*Math.sin(r);

  const point={
    p:'P'+pnum,
    role:'計算点',
    x,y,
    dir,
    angle:turn,
    distance:d,
    station:stationName,
    backsight:backsightName
  };

  const old=continuous.findIndex(v=>v.p===point.p);
  if(old>=0) continuous[old]=point;
  else continuous.push(point);

  card.querySelector('.cres2').innerHTML=
    '<div class="result"><b>'+point.p+'</b><br>'+
    '器械点 '+stationName+'　後視点 '+backsightName+
    '<br><span class="big">X = '+coordHtml(x)+'</span>'+
    '<br><span class="big">Y = '+coordHtml(y)+'</span>'+
    '<br>方向角 = '+degstr(dir)+'　内角 = '+degstr(turn)+'　距離 = '+dimHtml(d)+' m</div>';

  const rb=card.querySelector('.ccalc');
  const rr=card.querySelector('.crecalc');
  const nx=card.querySelector('.cnext');
  if(rb) rb.style.display='none';
  if(rr) rr.style.display='inline-block';
  if(nx) nx.style.display='inline-block';

  // この点を再計算したら、この点より後ろにある計算済み点も順番に再計算する。
  // 例：P3を再計算 → P4 → P5 → … と自動更新。
  if(cascade){
    const cards=[...$('continuousForms').querySelectorAll('.radial-form')];
    const index=cards.indexOf(card);
    for(let i=index+1;i<cards.length;i++){
      const nextCard=cards[i];
      const hasInput=nextCard.querySelector('.ca2').value.trim()!=='' &&
                     nextCard.querySelector('.cd2').value.trim()!=='';
      if(hasInput){
        calcContinuousForm(nextCard,false);
      }
    }
  }

  updateContinuousLastButtons();
  renderContinuousSummary();
  return true;
}

function updateContinuousLastButtons(){
  const cards=[...$('continuousForms').querySelectorAll('.radial-form')];
  cards.forEach((card,i)=>{
    const isLast=i===cards.length-1;
    const del=card.querySelector('.cdelete');
    const next=card.querySelector('.cnext');
    if(del) del.style.display=isLast ? 'inline-block' : 'none';
    if(next && card.querySelector('.crecalc').style.display!=='none'){
      next.style.display=isLast ? 'inline-block' : 'none';
    }
  });
}

function deleteContinuousForm(card){
  const cards=[...$('continuousForms').querySelectorAll('.radial-form')];
  if(cards.length===0 || cards[cards.length-1]!==card) return;

  const m=card.querySelector('h2').textContent.match(/P(\d+)/);
  if(m){
    const target=m[0];
    const idx=continuous.findIndex(v=>v.p===target);
    if(idx>=2) continuous.splice(idx,1);
  }

  card.remove();
  continuousCount=Math.max(0,continuousCount-1);
  updateContinuousLastButtons();
  renderContinuousSummary();
}

function drawContinuousFigure(){
  const svg=$('continuousFigure');
  if(!svg||continuous.length<2) return;
  const pts=continuous.filter(v=>Number.isFinite(v.x)&&Number.isFinite(v.y));
  if(pts.length<2) return;

  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  // 枠内に確実に収めるため、余白を十分に取った固定viewBoxに自動縮尺で描画
  const w=560, h=360, pad=62;
  const dx=maxX-minX || 1, dy=maxY-minY || 1;
  const scale=Math.min((w-2*pad)/dy,(h-2*pad)/dx);
  const sx=y=>pad+(y-minY)*scale;
  const sy=x=>h-pad-(x-minX)*scale;

  let out='<defs><marker id="axisArrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>';

  // P2→P1→P3→P4→P5…の順に結ぶ。
  const ordered=[];
  for(const name of ['P2','P1']){
    const q=pts.find(v=>v.p===name);
    if(q) ordered.push(q);
  }
  const later=pts.filter(p=>/^P\d+$/.test(p.p)&&parseInt(p.p.slice(1),10)>=3)
    .sort((a,b)=>parseInt(a.p.slice(1),10)-parseInt(b.p.slice(1),10));
  ordered.push(...later);

  for(let i=1;i<ordered.length;i++){
    const a=ordered[i-1], b=ordered[i];
    out+='<line x1="'+sx(a.y)+'" y1="'+sy(a.x)+'" x2="'+sx(b.y)+'" y2="'+sy(b.x)+'" stroke="#333" stroke-width="2"/>';
  }

  for(const q of pts){
    const cx=sx(q.y), cy=sy(q.x);
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#fff" stroke="#000" stroke-width="1.7"/>';
    out+='<text x="'+(cx+7)+'" y="'+(cy-7)+'" font-size="13" fill="#000">'+q.p+'</text>';
  }
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.innerHTML=out;
}
function renderContinuousSummary(){
  const box=$('continuousSummary');

  if(!continuous.length){
    box.innerHTML='';
    return;
  }

  const rows=continuous.map(v=>{

      '<td>'+(v.angle!=null?degstr(v.angle):'—')+'</td>'+
      '<td>'+(v.distance!=null?dimHtml(v.distance):'—')+'</td>'+
      '<td>'+(v.dir!=null?degstr(v.dir):'—')+'</td></tr>';
  }).join('');

  box.innerHTML=
    '<h3>連続トラバース結果</h3>'+
    '<div class="table-wrap"><table><thead><tr>'+
    '<th>点</th><th>区分</th><th>X</th><th>Y</th><th>夾角</th><th>距離</th><th>方向角</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="trav-figure-wrap">'+
    '<h3>連続トラバース図（P2→P1→P3→P4…）</h3>'+
    '<svg id="continuousFigure" viewBox="0 0 700 420" style="width:100%;height:auto;border:1px solid #ccc;background:#fff"></svg>'+
    '<div class="axis-legend"><svg viewBox="0 0 60 24" aria-label="X軸とY軸の正方向"><defs><marker id="legendArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs><line x1="14" y1="20" x2="14" y2="5" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><line x1="14" y1="20" x2="31" y2="20" stroke="#555" stroke-width="1.4" marker-end="url(#legendArrow)"/><text x="3" y="6" font-size="9">X＋</text><text x="34" y="23" font-size="9">Y＋</text></svg></div>'+
    '</div>';

  drawContinuousFigure();
}

function resetContinuous(){
  continuous=[]; continuousCount=0;
  $('centry').style.display='none'; $('clist').style.display='none';
  $('continuousForms').innerHTML=''; $('continuousSummary').innerHTML='';
}
</script>
